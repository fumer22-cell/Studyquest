<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avogadro Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-column station console. Sticky HUD on top, periodic-table tiles for the station map, one task per screen. */
:root{
  /* Palette named after flame-test colors */
  --hull:#0d1520;      /* background: station steel at night */
  --panel:#141f2d;
  --panel2:#1b2a3c;
  --line:#2a3b52;
  --ink:#e7edf5;
  --dim:#94a4bb;
  --na:#f4b43c;        /* sodium flame: primary accent */
  --on-na:#1d1404;
  --cu:#3fc8c0;        /* copper flame: info, electrons */
  --sr:#ff6464;        /* strontium flame: damage, errors */
  --ba:#93dc6c;        /* barium flame: success */
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--hull);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-text-size-adjust:100%;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;background-attachment:fixed}
sub,sup{font-size:.68em;line-height:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cu);outline-offset:2px}
.dim{color:var(--dim)}
.mono{font-family:var(--f-mono)}
.disp{font-family:var(--f-display);font-weight:800;letter-spacing:.01em;line-height:1;text-wrap:balance;margin:0}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--hull);border-bottom:1px solid var(--line)}
.hudin{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{background:none;border:0;padding:0;font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;color:var(--na);white-space:nowrap}
.bs{display:none}
@media (max-width:479px){.bl{display:none}.bs{display:inline}.hudin{gap:10px}}
.meter{display:flex;align-items:center;gap:6px;min-width:0}
.meter.hullm{flex:1}
.ml{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.bar{flex:1;height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;background:var(--ba);transition:width .4s,background .4s}
.bar i.low{background:var(--sr)}
.mv{font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.en .mv{color:var(--na)}
.databtn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.8rem;font-weight:700}

.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:var(--r);
  background:var(--panel2);border:1px solid var(--line);font-weight:700;text-align:center}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--na);border-color:var(--na);color:var(--on-na)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:38px;padding:8px 12px;font-size:.88rem}
.btn.ghost{background:transparent}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* Title */
.title{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.logo{width:132px;border:2px solid var(--na);border-radius:6px;padding:8px 10px 10px;display:flex;flex-direction:column;color:var(--na);background:var(--panel)}
.lz{font-family:var(--f-mono);font-size:.72rem}
.ls{font-family:var(--f-display);font-weight:800;font-size:3.6rem;line-height:1;margin-top:4px}
.ln{font-size:.78rem;color:var(--ink)}
.title h1{font-size:clamp(2.8rem,13vw,4.4rem);text-transform:uppercase}
.lede{margin:0;max-width:34em;font-size:1.05rem}
.kit{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.kit li{padding-left:18px;position:relative}
.kit li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--cu)}

/* MOLLY */
.molly{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.who{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;color:var(--cu);text-transform:uppercase}
.molly p{margin:0}

/* Map */
.maphead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.maphead h1{font-size:2.4rem;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .z{font-family:var(--f-mono);font-size:.75rem;color:var(--dim)}
.tile .sym{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1}
.tile .nm{font-weight:700;font-size:.95rem}
.tile .tp{font-size:.78rem;color:var(--dim);line-height:1.3}
.tile .stt{margin-top:6px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}
.tile.online{border-color:var(--ba)}
.tile.online .stt{color:var(--ba)}
.tile.next{border-color:var(--na);background:var(--panel2)}
.tile.next .sym,.tile.next .stt{color:var(--na)}
.tile.locked{opacity:.45;cursor:not-allowed}
.tile.locked .stt{color:var(--dim)}
.scoreline{font-family:var(--f-mono);font-size:.85rem;color:var(--dim)}

/* Task */
.task{display:flex;flex-direction:column;gap:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.chip.re{border-color:var(--na);color:var(--na)}
.story{margin:0;color:var(--dim);font-style:italic}
.q{font-size:1.14rem;line-height:1.5;margin:0}
.paper{display:flex;gap:10px;align-items:flex-start;border:1px dashed var(--na);border-radius:var(--r);padding:10px 12px;font-size:.92rem}
.paper .lbl{flex:none;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;background:var(--na);color:var(--on-na);padding:3px 6px;border-radius:4px;margin-top:2px}
.ans{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.ansrow{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.ansrow label{font-size:.75rem;color:var(--dim);display:block;margin-bottom:4px}
.inp{font:600 1.35rem var(--f-mono);background:var(--hull);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:7.2em;min-width:0}
.inp.sm{width:3.6em;font-size:1.05rem}
.inp.wide{width:100%;font-size:1.1rem}
.x10{font:600 1.35rem var(--f-mono);padding-top:30px}
.expw{display:flex;gap:4px;align-items:center;margin-top:-4px}
.sgn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font:700 1.1rem var(--f-mono)}
.units{display:flex;flex-wrap:wrap;gap:6px}
.tog{min-height:40px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--hull);font-weight:700;font-size:.92rem}
.tog[aria-pressed="true"]{background:var(--cu);border-color:var(--cu);color:var(--hull)}
.tog.bad{border-color:var(--sr);color:var(--sr)}
.tog.good{border-color:var(--ba);color:var(--ba)}
.err{color:var(--sr);font-size:.9rem;margin:0}
.hints{display:flex;flex-wrap:wrap;gap:8px}
.hintbox{display:grid;gap:10px}

.rule{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--panel)}
.rl{display:block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--na);margin-bottom:4px}
.rule p{margin:0}
.tscroll{overflow-x:auto}
.ctab{border-collapse:collapse;font-size:.9rem;width:100%;min-width:320px}
.ctab th,.ctab td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
.ctab th{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;color:var(--dim);letter-spacing:.08em}

/* Feedback */
.fb{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.fbh{padding:10px 14px;font-family:var(--f-display);font-weight:800;font-size:1.5rem;text-transform:uppercase;letter-spacing:.02em}
.fb.ok .fbh{background:var(--ba);color:var(--hull)}
.fb.no .fbh{background:var(--sr);color:var(--hull)}
.fbb{padding:12px 14px;display:grid;gap:12px}
.fbb p{margin:0}
.checks{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:6px}
.mk{font-weight:700;font-family:var(--f-mono)}
.mk.y{color:var(--ba)}.mk.n{color:var(--sr)}
.work{margin:0;padding-left:1.4em;display:grid;gap:4px;font-size:.95rem}
.work li::marker{color:var(--dim);font-family:var(--f-mono);font-size:.8em}
.sub-h{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0}
.dmg{color:var(--sr);font-family:var(--f-mono);font-size:.85rem}
.gain{color:var(--na);font-family:var(--f-mono);font-size:.85rem}

/* Balancing */
.bal{display:grid;gap:12px}
.eqrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px}
.sp{display:flex;align-items:center;gap:4px}
.step{display:flex;flex-direction:column;align-items:center}
.sbtn{width:34px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-weight:700;line-height:1}
.coef{font:700 1.2rem var(--f-mono);color:var(--na);min-width:1.4em;text-align:center}
.form{font-size:1.25rem}
.op{font-size:1.2rem;color:var(--dim)}
.atoms{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px;max-width:340px}
.ah{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);padding:0 8px}
.ael{font-weight:700;padding:4px 8px}
.acell{font-family:var(--f-mono);text-align:center;border-radius:6px;padding:4px}
.acell.eq{background:color-mix(in srgb,var(--ba) 22%,transparent);color:var(--ba)}
.acell.ne{background:color-mix(in srgb,var(--sr) 18%,transparent);color:var(--sr)}
.moles{margin:0;font-size:.88rem}

/* Equation tiles (net ionic, redox) */
.side{display:grid;gap:6px}
.side h3{margin:0;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.tiles{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ct{min-height:46px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:1.12rem}
.ct.solid{border-style:dashed;background:var(--panel)}
.ct.ion{border-color:var(--cu)}
.ct.struck{text-decoration:line-through;text-decoration-thickness:2px;opacity:.45;border-color:var(--line)}
.ct.sel-ox{border-color:var(--na);box-shadow:0 0 0 2px var(--na) inset}
.ct.sel-red{border-color:var(--cu);box-shadow:0 0 0 2px var(--cu) inset}
.tag{display:block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.sel-ox .tag{color:var(--na)}.sel-red .tag{color:var(--cu)}
.arrowline{text-align:center;color:var(--dim);font-size:1.3rem}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.edot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--cu);box-shadow:0 0 10px var(--cu);pointer-events:none;z-index:4}
.rxwrap{position:relative;display:grid;gap:12px}

.bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bins .btn{min-height:56px}
.bins .btn:last-child:nth-child(odd){grid-column:1/-1}
.bigeq{font-size:1.35rem;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 10px;overflow-x:auto}

/* Report */
.rep{display:grid;gap:10px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 10px;align-items:center}
.rbar{grid-column:1/-1;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.rbar i{display:block;height:100%}
.rpct{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}

/* Data sheet */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(5,9,14,.72);display:flex;align-items:flex-end;justify-content:center}
.sheetin{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;width:100%;max-width:640px;max-height:85vh;overflow:auto;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheethd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheethd h2{font-size:1.8rem;text-transform:uppercase}
.pt{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.pc{border:1px solid var(--line);border-radius:4px;padding:4px 6px;background:var(--hull)}
.pc b{display:block;font-family:var(--f-display);font-size:1.4rem;line-height:1.1}
.pc span{font-family:var(--f-mono);font-size:.72rem;color:var(--dim)}
.const{display:grid;gap:4px;margin-top:12px;font-size:.92rem}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="hud" id="hud"><div class="hudin">
  <button class="brand" data-act="map" aria-label="Station map"><span class="bl">Avogadro Stn</span><span class="bs">Av</span></button>
  <div class="meter hullm"><span class="ml">Hull</span><div class="bar"><i id="hullbar" style="width:100%"></i></div><span class="mv" id="hullv">100</span></div>
  <div class="meter en"><span class="ml">Energy</span><span class="mv" id="enev">20</span></div>
  <button class="databtn" data-act="sheet">Data</button>
</div></header>

<main class="wrap" id="view">
  <section class="title">
    <h1 class="disp">Avogadro Station</h1>
    <p class="lede">Loading station systems…</p>
  </section>
</main>

<div id="sheet" class="sheet" hidden><div class="sheetin" role="dialog" aria-label="Data sheet">
  <div class="sheethd"><h2 class="disp">Data sheet</h2><button class="btn small" data-act="sheet-close">Close</button></div>
  <div class="pt" id="ptable"></div>
  <div class="const">
    <div><b>Avogadro's number:</b> <span class="mono">6.022 × 10<sup>23</sup></span> particles/mol</div>
    <div><b>g → mol:</b> divide by molar mass (g/mol)</div>
    <div><b>mol → particles:</b> multiply by 6.022 × 10<sup>23</sup></div>
    <div><b>1 g</b> = 1000 mg</div>
  </div>
</div></div>

<script>
(function(){
'use strict';
const NA = 6.022e23;

/* ---------- Chemistry text formatter: C6H12O6 → subscripts, ^2+ → superscripts ---------- */
function F(str){
  str = String(str); let o = '', i = 0, inTag = false;
  while (i < str.length){
    const c = str[i];
    if (inTag){ o += c; if (c === '>') inTag = false; i++; continue; }
    if (c === '<'){ inTag = true; o += c; i++; continue; }
    if (c === '^'){
      let j = i + 1, t = '';
      if (str[j] === '{'){ j++; while (j < str.length && str[j] !== '}') t += str[j++]; j++; }
      else { while (j < str.length && /[0-9+\-]/.test(str[j])) t += str[j++]; }
      o += '<sup>' + t.replace(/-/g, '−') + '</sup>'; i = j; continue;
    }
    if (/[0-9]/.test(c) && i > 0 && /[A-Za-z)\]]/.test(str[i-1])){
      let j = i, t = ''; while (j < str.length && /[0-9]/.test(str[j])) t += str[j++];
      o += '<sub>' + t + '</sub>'; i = j; continue;
    }
    o += c; i++;
  }
  return o;
}

/* ---------- Number helpers ---------- */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function sfOf(s){
  s = String(s).replace(/^[+-]/, '');
  if (s.includes('.')) return s.replace('.', '').replace(/^0+/, '').length;
  const t = s.replace(/^0+/, '').replace(/0+$/, ''); return Math.max(1, t.length);
}
function randMant(sf){ const lo = 10 ** (sf - 1); return (rnd(lo, 10 * lo - 1) / lo).toFixed(sf - 1); }
function randPlain(){
  const sf = pick([2, 3, 3, 3, 4]); const m = randMant(sf); const k = Math.min(pick([0, 1, 1, 2]), sf - 1);
  return (+m * 10 ** k).toFixed(sf - 1 - k);
}
function toSci(v, sf){
  if (v === 0) return { m: (0).toFixed(sf - 1), e: 0 };
  let e = Math.floor(Math.log10(Math.abs(v))); let ms = (v / 10 ** e).toFixed(sf - 1);
  if (Math.abs(parseFloat(ms)) >= 10){ e++; ms = (v / 10 ** e).toFixed(sf - 1); }
  if (Math.abs(parseFloat(ms)) < 1){ e--; ms = (v / 10 ** e).toFixed(sf - 1); }
  return { m: ms, e };
}
const sci = (m, e) => `${m}×10^${e}`;
function num(v, sf = 4){
  const a = Math.abs(v);
  if (a >= 0.001 && a < 1e5) return String(+v.toPrecision(sf));
  const t = toSci(v, sf); return sci(t.m, t.e);
}
function ansText(a){ const t = toSci(a.value, a.sf); return `${sci(t.m, t.e)} ${a.unit}`; }
const roundLine = (a, why) => `Round to ${a.sf} sig figs${why ? ' (' + why + ')' : ''} → <b>${ansText(a)}</b>`;
const decimals = s => (String(s).split('.')[1] || '').length;

/* ---------- Substances (molar masses from the data sheet) ---------- */
const S = {
  glucose:{f:'C6H12O6', n:'glucose', mm:180.16, w:'6(12.01) + 12(1.008) + 6(16.00)', p:'molecules'},
  water:{f:'H2O', n:'water', mm:18.02, w:'2(1.008) + 16.00', p:'molecules'},
  n2o5:{f:'N2O5', n:'N2O5', mm:108.02, w:'2(14.01) + 5(16.00)', p:'molecules'},
  co2:{f:'CO2', n:'carbon dioxide', mm:44.01, w:'12.01 + 2(16.00)', p:'molecules'},
  ch4:{f:'CH4', n:'methane', mm:16.04, w:'12.01 + 4(1.008)', p:'molecules'},
  nh3:{f:'NH3', n:'ammonia', mm:17.03, w:'14.01 + 3(1.008)', p:'molecules'},
  n2:{f:'N2', n:'nitrogen gas', mm:28.02, w:'2(14.01)', p:'molecules'},
  h2:{f:'H2', n:'hydrogen gas', mm:2.016, w:'2(1.008)', p:'molecules'},
  o2:{f:'O2', n:'oxygen gas', mm:32.00, w:'2(16.00)', p:'molecules'},
  c3h8:{f:'C3H8', n:'propane', mm:44.09, w:'3(12.01) + 8(1.008)', p:'molecules'},
  nacl:{f:'NaCl', n:'sodium chloride', mm:58.44, w:'22.99 + 35.45'},
  caco3:{f:'CaCO3', n:'calcium carbonate', mm:100.09, w:'40.08 + 12.01 + 3(16.00)'},
  cao:{f:'CaO', n:'calcium oxide', mm:56.08, w:'40.08 + 16.00'},
  cacl2:{f:'CaCl2', n:'calcium chloride', mm:110.98, w:'40.08 + 2(35.45)'},
  mgcl2:{f:'MgCl2', n:'magnesium chloride', mm:95.21, w:'24.31 + 2(35.45)'},
  alcl3:{f:'AlCl3', n:'aluminum chloride', mm:133.33, w:'26.98 + 3(35.45)'},
  fe2o3:{f:'Fe2O3', n:'iron(III) oxide', mm:159.70, w:'2(55.85) + 3(16.00)'},

/* ---------- Balancing ---------- */
function parseF(f){
  let i = 0;
  function group(){
    const m = {};
    while (i < f.length && f[i] !== ')'){
      let sub;
      if (f[i] === '('){ i++; sub = group(); i++; }
      else { let el = f[i++]; while (i < f.length && /[a-z]/.test(f[i])) el += f[i++]; sub = {[el]:1}; }
      let n = ''; while (i < f.length && /\d/.test(f[i])) n += f[i++];
      const k = n ? +n : 1; for (const e in sub) m[e] = (m[e] || 0) + sub[e] * k;
    }
    return m;
  }
  return group();
}
function tally(L, R, c){
  const els = [], l = {}, r = {};
  const add = (f, k, side) => { const m = parseF(f); for (const e in m){ if (!els.includes(e)) els.push(e); side[e] = (side[e] || 0) + m[e] * k; } };
  L.forEach((f, i) => add(f, c[i], l)); R.forEach((f, k) => add(f, c[L.length + k], r));
  return { els, l, r };
}
const gcd = (a, b) => b ? gcd(b, a % b) : a;
function balState(L, R, c){
  const t = tally(L, R, c); const bal = t.els.every(e => (t.l[e] || 0) === (t.r[e] || 0));
  return { t, bal, lowest: c.reduce(gcd) === 1 };
}
function balancedText(L, R, c){
  const s = (f, k) => (k === 1 ? '' : k) + f;
  return L.map((f, i) => s(f, c[i])).join(' + ') + ' → ' + R.map((f, k) => s(f, c[L.length + k])).join(' + ');
}
function balanceHTML(L, R, c, locked){
  const sp = (f, i) => `<div class="sp"><div class="step">${locked ? '' : `<button class="sbtn" data-act="coef" data-i="${i}" data-d="1" aria-label="Increase coefficient">+</button>`}<span class="coef">${c[i]}</span>${locked ? '' : `<button class="sbtn" data-act="coef" data-i="${i}" data-d="-1" aria-label="Decrease coefficient">−</button>`}</div><div class="form">${F(f)}</div></div>`;
  const left = L.map((f, i) => sp(f, i)).join('<span class="op">+</span>');
  const right = R.map((f, k) => sp(f, L.length + k)).join('<span class="op">+</span>');
  const s = balState(L, R, c);
  const rows = s.t.els.map(e => { const a = s.t.l[e] || 0, b = s.t.r[e] || 0, k = a === b ? 'eq' : 'ne';
    return `<div class="ael">${e}</div><div class="acell ${k}">${a}</div><div class="acell ${k}">${b}</div>`; }).join('');
  const ml = c.slice(0, L.length).reduce((x, y) => x + y, 0), mr = c.slice(L.length).reduce((x, y) => x + y, 0);
  return `<div class="bal"><div class="eqrow">${left}<span class="op">→</span>${right}</div>
    <div class="atoms"><div class="ah">Atom</div><div class="ah">Left</div><div class="ah">Right</div>${rows}</div>
    <p class="moles">Total moles (sum of coefficients): <b>${ml}</b> left, <b>${mr}</b> right. <span class="dim">These don't have to match.</span></p></div>`;
}

const REROUTE = ['I rerouted that circuit. Same skill, new numbers. Work it on paper again.', 'Backup circuit. Same kind of problem, different values.', 'Let\'s run that one again with fresh values.'];
const FRESH = ['New reading coming in.', 'Another reading from the station log.', 'Fresh values from the sensors.'];

const baseId = id => String(id).split('~')[0];
function variantOf(t, reroute){
  let v;
  if (t.type === 'calc'){ v = { id:t.id, type:'calc', topic:t.topic, gen:t.gen, p: CALC[t.gen].rand(t.p) }; }
  else {
    const pool = ORIG.concat(EXTRA).filter(x => x.type === t.type && x.topic === t.topic && baseId(x.id) !== baseId(t.id));
    v = JSON.parse(JSON.stringify(pick(pool.length ? pool : [t])));
    delete v.n;
  }
  v.id = baseId(v.id) + '~' + Math.random().toString(36).slice(2, 7);
  v.reroute = !!reroute; v.depth = (t.depth || 0) + (reroute ? 1 : 0);
  v.story = pick(reroute ? REROUTE : FRESH);
  return v;
}

function gradeSci(){
  const a = ui.b.a;
  const ms = (document.getElementById('man').value || '').replace(/\s/g, '').replace(',', '.');
  let es = (document.getElementById('exp').value || '').replace(/\s/g, '').replace('−', '-');
  if (!/^(\d+\.?\d*|\.\d+)$/.test(ms)) return { err:'Enter the number part, like 1.23.' };
  if (es === '') es = '0';
  if (!/^[+-]?\d+$/.test(es)) return { err:'The exponent must be a whole number.' };
  if (!ui.unit) return { err:'Pick a unit.' };
  let e = parseInt(es, 10); if (ui.neg) e = -Math.abs(e);
  const mv = parseFloat(ms); if (mv === 0) return { err:'Zero isn\'t the answer here.' };

  const digits = ms.replace('.', '').replace(/^0+/, '');
  const usf = ms.includes('.') ? digits.length : (digits.replace(/0+$/, '').length || 1);
  const normd = mv >= 1 && mv < 10;

  const uUlp = 10 ** (Math.floor(Math.log10(Math.abs(uv))) - usf + 1);

  const sfOk = usf === a.sf;

      ? `Your digits are right, but the value is off by a factor of 10^${k}. Check your exponent${a.unit === 'mg' ? ' and the g → mg step' : ''}.`
      : `This doesn't match the key. Compare your paper with the worked solution below.`;
  } else if (!valOk) vDet = 'Close, but the last digit is off. Keep extra digits until the final step.';
  const rows = [

    ['Scientific notation', normd, normd ? 'The number in front is between 1 and 10.' : 'The number in front must be at least 1 and less than 10.'],

  if (ui.done) return;
  const t = ui.t; let ok = false, html = '';
  if (t.type === 'tf'){ const ans = v === '0'; ok = ans === t.a; html = `<p>Answer: <b>${t.a ? 'True' : 'False'}</b>. ${F(t.why)}</p>`; }
  if (t.type === 'choice'){ ok = +v === t.a; html = `<p>Answer: <b>${t.opts[t.a]}</b>. ${F(t.why)}</p>`; }
  if (t.type === 'classify'){ ok = v === t.a; const nm = CLASSES.find(c => c[0] === t.a)[1]; html = `<p>Answer: <b>${nm}</b>. ${F(t.why)}</p>`; }
  ui.picked = v;
  resolve(ok, 'major', html);
}
function resolve(ok, sev, html){
  const c = st.cur, t = ui.t, m = MODS[c.m];
  ui.done = true;
  const s = st.stats[t.topic] || (st.stats[t.topic] = {n:0, ok:0}); s.n++; if (ok) s.ok++;
  if (!t.reroute && !m.final && !st.done.includes(m.id)){ st.score.n++; if (ok) st.score.ok++; }
  let extra = '';
  if (ok){
    const gain = t.reroute ? 4 : 10; st.energy += gain; if (!t.reroute) c.first++;
    extra = `<p class="gain">+${gain} energy</p>`;
  } else {
    const d = sev === 'minor' ? 6 : 15; st.hull -= d; st.missed[t.topic] = (st.missed[t.topic] || 0) + 1;
    extra = `<p class="dmg">−${d} hull${sev === 'minor' ? ' (formatting only, lighter damage)' : ''}</p>`;
    if (st.hull <= 0){ st.patches++; st.hull = 35; extra += `<p class="dmg">Hull failure. MOLLY used an emergency patch (${st.patches} so far). Hull is back to 35.</p>`; }
    if ((t.depth || 0) < 2){ c.queue.push(variantOf(t, true)); c.rer++; extra += `<p class="dim">MOLLY queued a rerouted version with new values before this system closes.</p>`; }
  }
  save();
  drawBody(); drawHints();
  if (['tf','choice','classify'].includes(t.type)) markPicked(ok);
  restoreInputs();
  document.getElementById('fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><div class="fbh">${ok ? 'Repair holds' : 'Not quite'}</div>
    <div class="fbb">${html}${extra}<button class="btn primary" data-act="next">Continue</button></div></div>`;
  hud();
  document.getElementById('fb').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'});
}
function snapInputs(){ ui.snap = {}; view.querySelectorAll('input').forEach(i => { ui.snap[i.id] = i.value; }); }
function restoreInputs(){ if (!ui.snap) return; for (const id in ui.snap){ const el = document.getElementById(id); if (el) el.value = ui.snap[id]; } }
function markPicked(ok){
  view.querySelectorAll('[data-act="pickc"]').forEach(b => {
    const t = ui.t; const v = b.dataset.v;
    const right = t.type === 'tf' ? ((v === '0') === t.a) : t.type === 'choice' ? +v === t.a : v === t.a;
    if (right) b.style.borderColor = 'var(--ba)';
    if (v === ui.picked && !ok) b.style.borderColor = 'var(--sr)';
  });
}
function sendElectrons(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  requestAnimationFrame(() => {
    const wrap = document.getElementById('rxwrap'); if (!wrap) return;
    const tiles = wrap.querySelectorAll('[data-side="L"]'); const a = tiles[ui.t.ox], b = tiles[ui.t.red]; if (!a || !b) return;
    const w = wrap.getBoundingClientRect(), ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const x0 = ra.left - w.left + ra.width / 2, y0 = ra.top - w.top + ra.height / 2, x1 = rb.left - w.left + rb.width / 2, y1 = rb.top - w.top + rb.height / 2;
    for (let k = 0; k < 3; k++){
      const d = document.createElement('span'); d.className = 'edot'; d.style.left = (x0 - 5) + 'px'; d.style.top = (y0 - 5) + 'px'; wrap.appendChild(d);
      const anim = d.animate([{transform:'translate(0,0)', opacity:1}, {transform:`translate(${(x1 - x0) / 2}px,${(y1 - y0) / 2 - 40}px)`, opacity:1}, {transform:`translate(${x1 - x0}px,${y1 - y0}px)`, opacity:0}], {duration:900, delay:k * 180, easing:'ease-in-out', fill:'both'});
      anim.onfinish = () => d.remove();
    }
  });
}

/* ---------- Module completion, ending, report ---------- */
function nextTask(){
  const c = st.cur; c.pos++;
  if (c.pos < c.queue.length){ save(); renderTask(); return; }
  const m = MODS[c.m], tot = c.queue.filter(x => !x.reroute).length;
  if (!st.done.includes(m.id)) st.done.push(m.id);
  const res = { first:c.first, tot, rer:c.rer };
  st.cur = null;
  if (m.final){ st.finished = true; save(); renderEnding(res); return; }
  save();
  show(`<section class="task">
    <div class="meta"><span class="chip">System ${MODS.indexOf(m) + 1} · online</span></div>
    <h1 class="disp" style="font-size:2.6rem;text-transform:uppercase">${m.name} restored</h1>
    ${molly(m.outro)}
    <div class="rule"><span class="rl">Repair log</span><p>First-try correct: <b>${res.first} of ${res.tot}</b>. Reroutes needed: <b>${res.rer}</b>.</p></div>
    <button class="btn primary" data-act="map">Back to station map</button>
  </section>`);
}
function renderEnding(res){
  const pct = st.score.n ? Math.round(100 * st.score.ok / st.score.n) : 0;
  let head, lines;
  if (pct >= 85 && st.patches === 0){ head = 'Course set for home'; lines = ['All systems green. You did the math by hand and it held.', 'You\'re ready for the quiz. Run a remix once more the night before to keep it fresh.']; }
  else if (pct >= 65){ head = 'Limping home'; lines = ['We\'re moving, but a few systems are running on patches.', 'Check the study report for the topics that cost you hull, then run a remix.']; }
  else { head = 'Drifting, but alive'; lines = ['We got everything online, barely.', 'Go through the study report, reread those rule cards, and run a remix run. The numbers change every time.']; }
  show(`<section class="task">
    <h1 class="disp" style="font-size:2.8rem;text-transform:uppercase">${head}</h1>
    ${molly(lines)}
    <div class="rule"><span class="rl">Final numbers</span>
      <p>Study guide problems right on the first try: <b>${st.score.ok} of ${st.score.n}</b> (${pct}%).<br>Final check first-try: <b>${res.first} of ${res.tot}</b>. Emergency patches: <b>${st.patches}</b>.</p></div>
    <div class="stack"><button class="btn primary" data-act="report">Open study report</button><button class="btn" data-act="remix">${ui.confirm === 'remix' ? 'Tap again to start a remix run' : 'Remix run: new numbers'}</button></div>
  </section>`);
}
function renderReport(){
  const rows = Object.keys(TOPICS).map(k => {
    const s = st.stats[k]; const pct = s && s.n ? Math.round(100 * s.ok / s.n) : null;
    const col = pct === null ? 'var(--line)' : pct >= 80 ? 'var(--ba)' : pct >= 60 ? 'var(--na)' : 'var(--sr)';
    return { k, pct, html: `<div class="rrow"><span>${F(TOPICS[k].name)} <span class="dim" style="font-size:.85rem">${s ? `(${s.ok}/${s.n})` : '(not tried yet)'}</span></span><span class="rpct">${pct === null ? '—' : pct + '%'}</span><div class="rbar"><i style="width:${pct || 0}%;background:${col}"></i></div></div>` };
  });
  const weak = rows.filter(r => r.pct !== null && r.pct < 80);
  show(`<section class="task">
    <h1 class="disp" style="font-size:2.6rem;text-transform:uppercase">Study report</h1>
    <p class="dim" style="margin:0">Accuracy per topic across every attempt, including reroutes.</p>
    <div class="rep">${rows.map(r => r.html).join('')}</div>
    ${weak.length ? `<p class="sub-h" style="margin-top:8px">Review these rules</p>${weak.map(r => ruleCard(r.k)).join('')}` : (Object.keys(st.stats).length ? '<p>No weak topics so far.</p>' : '')}
    <div class="row"><button class="btn primary" data-act="map">Station map</button><button class="btn" data-act="title">Title screen</button></div>
  </section>`);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act !== 'new' && act !== 'remix') ui.confirm = null;
  switch (act){
    case 'title': renderTitle(); break;
    case 'continue': st.done.length || st.cur ? renderMap() : renderBoot(); break;
    case 'new':
      if ((st.done.length || st.cur) && ui.confirm !== 'new'){ ui.confirm = 'new'; renderTitle(); break; }
      st = fresh(); save(); ui = {}; renderBoot(); break;
    case 'remix':
      if (ui.confirm !== 'remix'){ ui.confirm = 'remix'; b.textContent = (st.done.length || st.cur) && !st.finished ? 'Tap again: erase progress and remix' : 'Tap again to start a remix run'; break; }
      st = fresh(); st.remix = true; save(); ui = {}; renderBoot(); break;
    case 'map': renderMap(); break;
    case 'mod': { const i = +b.dataset.i; if (!unlocked(i)) break; if (st.cur && st.cur.m !== i) st.cur = null; startModule(i); break; }
    case 'begin': renderTask(); break;
    case 'report': renderReport(); break;
    case 'sheet': document.getElementById('sheet').hidden = false; break;
    case 'sheet-close': document.getElementById('sheet').hidden = true; break;
    case 'hint': {
      const h = b.dataset.h, cost = h === 'rule' ? 5 : 10; if (st.energy < cost) break;
      st.energy -= cost; ui.hints[h] = true; save(); hud(); drawHints(); break;
    }
    case 'unit': ui.unit = b.dataset.u; view.querySelectorAll('[data-act="unit"]').forEach(x => x.setAttribute('aria-pressed', x.dataset.u === ui.unit)); break;
    case 'sgn': ui.neg = !ui.neg; b.textContent = ui.neg ? '−' : '+'; break;
    case 'submit': snapInputs(); submit(); break;
    case 'pickc': pickChoice(b.dataset.v); break;
    case 'next': nextTask(); break;
    case 'coef': {
      const i = +b.dataset.i, d = +b.dataset.d; ui.coefs[i] = Math.min(12, Math.max(1, ui.coefs[i] + d));
      const t = ui.t; const L = t.type === 'balance' ? t : LIM[t.p.r];
      document.getElementById('balbox').innerHTML = balanceHTML(L.L, L.R, ui.coefs, false); break;
    }
    case 'checkbal': {
      const L = LIM[ui.t.p.r], s = balState(L.L, L.R, ui.coefs), e1 = document.getElementById('err1');
      if (s.bal && s.lowest){ ui.phase = 'answer'; drawBody(); break; }
      if (!ui.flags.bal){ ui.flags.bal = true; st.hull -= 6; if (st.hull <= 0){ st.patches++; st.hull = 35; } save(); hud(); }
      e1.textContent = !s.bal ? 'Not balanced yet: fix the red rows. (−6 hull)' : 'Balanced, but not in lowest whole numbers. (−6 hull)';
      break;
    }
    case 'chipv': { const v = b.dataset.v; ui.sel = ui.sel.includes(v) ? ui.sel.filter(x => x !== v) : ui.sel.concat(v); b.setAttribute('aria-pressed', ui.sel.includes(v)); break; }
    case 'lockchips': {
      if (!ui.sel.length){ document.getElementById('err1').textContent = 'Pick at least one value.'; break; }
      const need = ui.b.need, good = need.length === ui.sel.length && need.every(v => ui.sel.includes(v));
      if (!good){ ui.flags.sel = true; st.hull -= 6; if (st.hull <= 0){ st.patches++; st.hull = 35; } save(); hud(); }
      ui.phase = 'answer'; drawBody();
      document.getElementById('err1').textContent = good ? 'Correct values. Now calculate.' : 'Not quite (−6 hull). Green values are the ones you need. Use those for step 2.';
      break;
    }
    case 'nsplit': {
      const side = b.dataset.side, i = +b.dataset.i, x = ui.net[side][i];
      if (x.st === 's'){ ui.net.solidTap = true; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); document.getElementById('err').textContent = 'Solids stay together. Never split a (s).'; break; }
      x.split = true; drawBody(); break;
    }
    case 'nstrike': { const k = b.dataset.k; ui.net.struck[k] = !ui.net.struck[k]; b.classList.toggle('struck', ui.net.struck[k]); break; }
    case 'rpick': {
      const X = ui.rx, side = b.dataset.side, i = +b.dataset.i;
      if (side === 'R'){ X.prodTap = true; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); document.getElementById('err').textContent = 'That\'s a product. Pick from the reactants only.'; break; }
      if (X.ox === null) X.ox = i; else if (X.red === null && i !== X.ox) X.red = i;
      drawBody(); break;
    }
    case 'rreset': ui.rx.ox = null; ui.rx.red = null; drawBody(); break;
  }
});
document.getElementById('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') e.currentTarget.hidden = true; });
view.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  const s = view.querySelector('[data-act="submit"]:not([disabled])'); if (s){ e.preventDefault(); s.click(); }
});

/* Data sheet */
const PT = [['H','1.008'],['C','12.01'],['N','14.01'],['O','16.00'],['Na','22.99'],['Mg','24.31'],['Al','26.98'],['S','32.07'],['Cl','35.45'],['K','39.10'],['Ca','40.08'],['Fe','55.85'],['Ni','58.69'],['Cu','63.55'],['Zn','65.38'],['Br','79.90'],['Ag','107.87'],['Sn','118.71'],['I','126.90'],['Ba','137.33'],['Pb','207.2']];
document.getElementById('ptable').innerHTML = PT.map(([s, m]) => `<div class="pc"><b>${s}</b><span>${m}</span></div>`).join('');

window.__avogadro = { CALC, toSci, sfOf, parseF, balState, ORIG, EXTRA, variantOf };
renderTitle();
})();
