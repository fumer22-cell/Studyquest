<title>Avogadro Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: pixel-art space station. Fixed starfield behind a one-column game console; HUD pinned on top. */
:root{
  --void:#0b0d1a;     /* deep space */
  --hull:#181c30;
  --panel:#262b44;
  --panel2:#303757;
  --line:#3a4466;
  --steel:#5a6988;
  --ink:#eef0f8;
  --dim:#9aa3c2;
  --na:#feae34;       /* sodium flame: primary accent */
  --on-na:#2a1a00;
  --cu:#2ce8f5;       /* copper flame: electrons, info */
  --sr:#e43b44;       /* strontium flame: damage */
  --ba:#63c74d;       /* barium flame: success */
  --pink:#b55088;
  --orange:#f77622;
  --blue:#0099db;
  --f-pix:'Press Start 2P','Courier New',monospace;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-ui:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --notch:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 4px,4px 4px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--void);color:var(--ink);font:18px/1.45 var(--f-body);-webkit-text-size-adjust:100%;overflow-x:hidden}
canvas.pix,.pix{image-rendering:pixelated;image-rendering:crisp-edges}
sub,sup{font-size:.75em;line-height:0}
sub{vertical-align:-.3em}sup{vertical-align:.5em}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:pixelated}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
#flash{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0}
#flash.red{background:var(--sr)}#flash.green{background:var(--ba)}
#flash.on{animation:flash .35s steps(3) forwards}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}
#app{position:relative;z-index:1}
#app.shake{animation:shake .4s steps(2)}
@keyframes shake{0%{transform:translate(4px,0)}25%{transform:translate(-4px,4px)}50%{transform:translate(4px,-4px)}75%{transform:translate(-4px,0)}100%{transform:none}}

/* Pixel primitives */
.win{background:var(--panel);clip-path:var(--notch);box-shadow:inset 0 0 0 4px var(--line);padding:16px}
.pb{font:700 15px/1.3 var(--f-ui);text-transform:uppercase;letter-spacing:.02em;color:var(--ink);background:var(--panel2);border:0;padding:14px 16px;min-height:48px;
  clip-path:var(--notch);box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.14);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.pb:active:not(:disabled){transform:translateY(2px);box-shadow:inset 4px 4px 0 rgba(0,0,0,.35)}
.pb:focus-visible,.sw:focus-visible,.room:focus-visible,.key:focus-visible{outline:none;box-shadow:inset 0 0 0 4px var(--cu)}
.pb.go{background:var(--na);color:var(--on-na)}
.pb.cy{background:var(--cu);color:#04282b}
.pb.ok{background:var(--ba);color:#0b1a07}
.pb.bad{background:var(--sr)}
.pb.big{font-size:13px;min-height:58px;width:100%}
.pb.sm{font-size:9px;min-height:38px;padding:10px 12px}
.pb:disabled{filter:grayscale(.85) brightness(.6);cursor:not-allowed}
.lab{font:700 13px/1.2 var(--f-ui);letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.h1{font:clamp(18px,6vw,26px)/1.2 var(--f-pix);margin:0;color:var(--na);text-shadow:0 3px 0 #7a2a10;text-wrap:balance}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.dim{color:var(--dim)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hull);box-shadow:0 4px 0 var(--line)}
.hudin{max-width:640px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:10px}
.rank{display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px;font:700 13px var(--f-ui);color:var(--na);text-transform:uppercase}
.rank canvas{width:27px;height:27px}
#rankname{display:none}
@media (min-width:520px){#rankname{display:inline}}
.hullw{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden;background:none;border:0;padding:4px 0}
.segs{display:flex;gap:2px}
.seg{width:5px;height:14px;background:var(--line)}
.seg.on{background:var(--ba)}.segs.low .seg.on{background:var(--sr);animation:blink .6s steps(2) infinite}
.enw{display:flex;align-items:center;gap:6px}
#enev{font:700 15px var(--f-ui);color:var(--na)}
.combo{font:700 14px var(--f-ui);color:var(--void);background:var(--na);padding:4px 5px}
.icon{width:36px;height:36px;border:0;background:var(--panel2);clip-path:var(--notch);font:700 14px var(--f-ui);display:flex;align-items:center;justify-content:center;padding:0}
.icon.off{color:var(--dim);text-decoration:line-through}

.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:18px 72px}
.scr{display:flex;flex-direction:column;gap:14px}

/* Title */
.title{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:10px}
.shipart{width:144px;height:192px}
.logo{margin:0;display:flex;flex-direction:column;gap:10px;font-family:var(--f-pix);font-weight:400}
.logo .l1{font-size:clamp(22px,8.4vw,40px);color:var(--na);text-shadow:0 4px 0 var(--orange),0 8px 0 #7a2a10}
.logo .l2{font-size:clamp(18px,6.6vw,32px);color:var(--cu);text-shadow:0 4px 0 var(--blue),0 8px 0 #0a3a5a}
.tag{margin:0;font:700 14px/1.6 var(--f-ui);color:var(--dim)}
.title .stack{width:100%;max-width:340px}
.kit{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.kit li{font:700 13px/1.4 var(--f-ui);background:var(--panel);padding:8px 10px;clip-path:var(--notch);color:var(--ink)}

/* MOLLY */
.talk{display:flex;gap:10px;align-items:flex-start}
.talk canvas{width:72px;height:64px;flex:none}
.say{position:relative;flex:1;min-width:0;min-height:64px;background:#12162a;color:var(--ink);padding:12px 14px;clip-path:var(--notch);box-shadow:inset 0 0 0 3px var(--cu);font-size:18px;cursor:pointer}
.say .who{display:block;font:700 13px var(--f-ui);color:var(--cu);margin-bottom:6px;letter-spacing:.06em}

/* Scenes */
.scene{position:relative;background:#05060d;clip-path:var(--notch);box-shadow:inset 0 0 0 4px var(--line);padding:4px;display:flex;justify-content:center}
.scene canvas{display:block;image-rendering:pixelated}
.stag{position:absolute;left:8px;top:8px;font:700 13px/1.4 var(--f-ui);background:rgba(5,6,13,.75);padding:4px 6px;color:var(--ink)}
.schips{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.chip{font:700 13px/1.4 var(--f-ui);background:rgba(5,6,13,.75);padding:4px 6px;color:var(--dim);text-transform:uppercase}
.chip.re{color:var(--na)}
.charge{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:6px;background:rgba(5,6,13,.75);padding:4px 6px}
.cbar{flex:1;height:8px;background:var(--line)}
.cbar i{display:block;height:100%;background:var(--cu)}
.timer{font:700 14px var(--f-ui);color:var(--na)}
.timer.low{color:var(--sr);animation:blink .5s steps(2) infinite}

/* Question terminal */
.crt{background:#0d1424;clip-path:var(--notch);box-shadow:inset 0 0 0 4px var(--line);padding:14px 16px;font-size:20px;line-height:1.55;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 4px)}
.crt .lab{display:block;margin-bottom:8px;color:var(--cu)}
.crt p{margin:0}
.paper{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--dim)}
.paper b{font:700 13px var(--f-ui);background:var(--na);color:var(--on-na);padding:4px 5px;flex:none;margin-top:2px}

/* Device panels */
.dev{display:grid;gap:12px}
.devh{font:700 14px var(--f-ui);color:var(--na);letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.lcd{background:#0f2a1f;color:#7dff9b;font:600 clamp(24px,7.5vw,32px)/1.2 var(--f-num);padding:16px 12px;clip-path:var(--notch);box-shadow:inset 0 0 0 4px #1f4a33;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px;min-height:64px;overflow-x:auto}
.lcd .fld{padding:2px 3px}
.lcd .fld.act{background:rgba(125,255,155,.15)}
.lcd .ph{opacity:.35}
.lcd sup{font-size:.7em;line-height:1;vertical-align:.7em;display:inline-flex}
.lcd .u{margin-left:auto;font:700 18px var(--f-ui);color:var(--na)}
.cur{display:inline-block;width:.55em;height:1em;background:#7dff9b;vertical-align:-.1em;animation:blink 1s steps(2) infinite}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.key{font:700 24px var(--f-num);min-height:52px;border:0;background:#3a4466;color:var(--ink);clip-path:var(--notch);box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.14)}
.key:active:not(:disabled){transform:translateY(2px)}
.key.fn{font:700 16px var(--f-ui);background:var(--panel2);color:var(--cu)}
.key.fn.on{background:var(--cu);color:#04282b}
.key.w2{grid-column:span 2}
.key:disabled{opacity:.3}
.units{display:flex;flex-wrap:wrap;gap:6px}
.sw{font:700 17px var(--f-ui);min-height:40px;padding:8px 10px;border:0;background:#1a1f36;color:var(--dim);clip-path:var(--notch);box-shadow:inset 0 0 0 3px var(--line)}
.sw[aria-pressed="true"]{background:var(--cu);color:#04282b;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.sw.good{box-shadow:inset 0 0 0 3px var(--ba);color:var(--ba)}
.sw.bad{box-shadow:inset 0 0 0 3px var(--sr);color:var(--sr)}
.err{color:var(--sr);font-size:15px;margin:0;min-height:1em}
.lever{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lv{border:0;background:#1a1f36;color:var(--dim);font:700 13px/1.8 var(--f-ui);padding:12px 8px;clip-path:var(--notch);box-shadow:inset 0 0 0 3px var(--line)}
.lv b{font-size:14px;display:block;color:var(--ink)}
.lv[aria-pressed="true"]{background:var(--na);color:var(--on-na);box-shadow:inset 0 -5px 0 rgba(0,0,0,.25)}
.lv[aria-pressed="true"] b{color:var(--on-na)}

/* Reactor */
.eqrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;justify-content:center}
.sp{display:flex;align-items:center;gap:4px}
.step{display:flex;flex-direction:column;align-items:center;gap:2px}
.sbtn{width:36px;height:28px;border:0;background:var(--panel2);font:700 15px var(--f-ui);clip-path:var(--notch)}
.coef{font:700 22px var(--f-num);color:var(--na);min-width:1.4em;text-align:center}
.form{font-size:24px}
.op{font-size:20px;color:var(--dim)}
.chamber{display:grid;gap:6px;background:#0d1424;padding:10px;clip-path:var(--notch)}
.chrow{display:grid;grid-template-columns:30px minmax(0,1fr) 22px minmax(0,1fr);gap:6px;align-items:center}
.chrow b{font:700 14px var(--f-ui)}
.dots{display:flex;flex-wrap:wrap;gap:2px;align-items:center;min-height:14px}
.dots.r{justify-content:flex-start}
.dot{width:8px;height:8px;display:inline-block}
.dots em{font:700 13px var(--f-ui);font-style:normal;color:var(--dim);margin-left:4px}
.eqs{font:700 15px var(--f-ui);text-align:center}
.eqs.y{color:var(--ba)}.eqs.n{color:var(--sr)}
.core{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:700 13px/1.6 var(--f-ui)}
.core .st{padding:4px 6px}
.core .st.y{background:var(--ba);color:#0b1a07}.core .st.n{background:var(--sr);animation:blink .8s steps(2) infinite}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gauge{background:#0d1424;clip-path:var(--notch);padding:10px;display:grid;gap:8px;justify-items:center;text-align:center}
.gv{font:700 34px var(--f-num);color:var(--na)}
.plates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plate{min-height:84px;font-size:13px}

/* Radar */
.scope{position:relative;height:170px;background:#07140e;clip-path:var(--notch);overflow:hidden;display:flex;align-items:center;justify-content:center;
  background-image:linear-gradient(rgba(99,199,77,.12) 2px,transparent 2px),linear-gradient(90deg,rgba(99,199,77,.12) 2px,transparent 2px);background-size:24px 24px}
.sweep{position:absolute;left:50%;top:50%;width:400px;height:400px;margin:-200px 0 0 -200px;background:conic-gradient(from 0deg,rgba(99,199,77,.4),transparent 20%);animation:spin 3s steps(24) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blip{position:relative;z-index:1;background:rgba(7,20,14,.9);box-shadow:inset 0 0 0 3px var(--ba);clip-path:var(--notch);padding:12px 14px;font-size:20px;max-width:92%;text-align:center}
.chans{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chans .pb{min-height:58px;flex-direction:column;gap:4px}
.chans .pb small{font-size:7px;color:var(--dim)}
.chans .pb:last-child{grid-column:1/-1}

/* Water tank */
.tank{position:relative;background:linear-gradient(#0a2c48,#081a2e);clip-path:var(--notch);box-shadow:inset 0 0 0 4px var(--steel);padding:12px;min-height:110px;overflow:hidden}
.tank .lab{display:block;margin-bottom:10px;color:var(--cu)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bb{border:0;min-height:48px;padding:10px 14px;font-size:19px;color:var(--ink);background:rgba(44,232,245,.14);clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);box-shadow:inset 0 0 0 3px var(--cu);animation:bob 2.4s steps(4) infinite}
.bb:nth-child(2n){animation-delay:-.8s}.bb:nth-child(3n){animation-delay:-1.6s}
@keyframes bob{50%{transform:translateY(-4px)}}
.bb.cmp{background:rgba(254,174,52,.14);box-shadow:inset 0 0 0 3px var(--na)}
.bb.solid{animation:none;clip-path:var(--notch);background:repeating-linear-gradient(45deg,#c0cbdc 0 6px,#8b93af 6px 12px);color:#10131f;box-shadow:inset 0 0 0 3px var(--ink);font-weight:700}
.bb.vent{opacity:.4;text-decoration:line-through;text-decoration-thickness:3px;box-shadow:inset 0 0 0 3px var(--dim)}
.bb.gone{animation:gone 1s steps(5) forwards}
@keyframes gone{to{transform:translateY(-60px);opacity:0}}
.bb.drop{animation:drop .8s steps(4) forwards}
@keyframes drop{from{transform:translateY(-20px)}to{transform:translateY(8px)}}
.shk{animation:shk .3s steps(2)}
@keyframes shk{33%{transform:translateX(-6px)}66%{transform:translateX(6px)}}
.flow{text-align:center;font:700 14px var(--f-ui);color:var(--dim)}

/* Power cells */
.rxwrap{position:relative;display:grid;gap:12px}
.rxwrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
.cells{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cell{position:relative;border:0;min-height:96px;padding:18px 8px 10px;background:#1a1f36;clip-path:var(--notch);box-shadow:inset 0 0 0 4px var(--steel);font-size:21px;touch-action:none;display:grid;justify-items:center;align-content:center;gap:4px}
.cell::before{content:"";position:absolute;top:0;left:50%;width:22px;height:8px;margin-left:-11px;background:var(--steel)}
.cell .tg{font:700 13px var(--f-ui);min-height:1em}
.cell.ox{box-shadow:inset 0 0 0 4px var(--na)}.cell.ox .tg{color:var(--na)}
.cell.red{box-shadow:inset 0 0 0 4px var(--cu)}.cell.red .tg{color:var(--cu)}
.outs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.outs .bb{animation:none;background:#1a1f36;box-shadow:inset 0 0 0 3px var(--line);font-size:17px}
.edot{position:absolute;width:10px;height:10px;background:var(--cu);box-shadow:0 0 0 2px #04282b;pointer-events:none;z-index:4}

/* Cargo */
.crate{background:repeating-linear-gradient(90deg,#b86f50 0 18px,#8a4b2a 18px 22px);clip-path:var(--notch);box-shadow:inset 0 0 0 5px #5c2e1a;padding:16px;display:grid;gap:10px}
.crate.open{animation:pop .5s steps(3)}
@keyframes pop{50%{transform:scale(1.03)}}
.label{background:#e8d9a8;color:#2a1a0a;clip-path:var(--notch);padding:10px 12px;display:grid;gap:4px}
.label .lab{color:#6a4a2a}
.inpx{font:20px var(--f-body);background:#fff8e0;color:#2a1a0a;border:0;box-shadow:inset 0 0 0 3px #6a4a2a;padding:10px;width:100%;min-width:0}
.inpx:focus{outline:none;box-shadow:inset 0 0 0 3px var(--blue)}
.inpx:disabled{opacity:.8}

/* Fabricator */
.slots{display:flex;gap:6px;flex-wrap:wrap;min-height:56px;background:#0d1424;padding:8px;clip-path:var(--notch)}
.slot{width:44px;height:40px;box-shadow:inset 0 0 0 2px var(--line)}
.cart{border:0;min-width:84px;min-height:56px;padding:18px 8px 8px;font:700 17px var(--f-num);background:#1a1f36;color:var(--ink);position:relative;clip-path:var(--notch);box-shadow:inset 0 0 0 3px var(--steel)}
.cart::before{content:"";position:absolute;left:4px;right:4px;top:4px;height:8px;background:var(--c,var(--na))}
.cart[aria-pressed="true"]{background:var(--panel2);box-shadow:inset 0 0 0 3px var(--cu)}
.cart.good{box-shadow:inset 0 0 0 3px var(--ba)}.cart.bad{box-shadow:inset 0 0 0 3px var(--sr);animation:shk .3s steps(2)}

/* Hints & feedback */
.hints{display:flex;flex-wrap:wrap;gap:8px}
.hintbox{display:grid;gap:10px}
.rule{background:#e8d9a8;color:#2a1a0a;clip-path:var(--notch);padding:12px 14px;font-size:16px}
.rule .lab{display:block;color:#8a4b2a;margin-bottom:6px}
.rule p{margin:0}
.tscroll{overflow-x:auto}
.ctab{border-collapse:collapse;font-size:15px;width:100%;min-width:300px}
.ctab th,.ctab td{text-align:left;padding:4px 6px;border-bottom:2px solid rgba(42,26,10,.2)}
.ctab th{font:700 13px var(--f-ui);text-transform:uppercase}
.fb{padding:0;overflow:hidden}
.fbh{font:14px/1.4 var(--f-pix);padding:14px 16px;text-transform:uppercase}
.fb.ok .fbh{background:var(--ba);color:#0b1a07}
.fb.no .fbh{background:var(--sr);color:var(--ink)}
.fbb{padding:14px 16px 16px;display:grid;gap:12px;font-size:17px}
.fbb p{margin:0}
.checks{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:26px 1fr;gap:6px}
.mk{font:700 15px var(--f-ui);padding-top:3px}
.mk.y{color:var(--ba)}.mk.n{color:var(--sr)}
.work{margin:0;padding:10px 10px 10px 34px;display:grid;gap:4px;font-size:16px;background:#0d1424;clip-path:var(--notch)}
.work li::marker{font:700 14px var(--f-ui);color:var(--dim)}
.gain{font:700 14px var(--f-ui);color:var(--na);margin:0}
.dmg{font:700 14px/1.6 var(--f-ui);color:var(--sr);margin:0}

/* Map */
.maptop{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.ship{display:flex;flex-direction:column;align-items:stretch}
.nose{height:36px;margin:0 22%;background:var(--steel);clip-path:polygon(30% 0,70% 0,70% 12px,85% 12px,85% 24px,100% 24px,100% 100%,0 100%,0 24px,15% 24px,15% 12px,30% 12px)}
.hullbox{position:relative;background:var(--hull);clip-path:var(--notch);box-shadow:inset 0 0 0 4px var(--steel);padding:10px}
.trunk{position:absolute;left:50%;top:10px;bottom:10px;width:6px;margin-left:-3px;background:var(--line)}
.trunk i{position:absolute;left:0;right:0;bottom:0;background:var(--cu)}
.rooms{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px}

    if (inTag){ o += c; if (c === '>') inTag = false; i++; continue; }

      let j = i, t = ''; while (j < str.length && /[0-9]/.test(str[j])) t += str[j++];

/* ---------- Number helpers ---------- */

const CALC = {
  mass:{
    build(p){

/* ---------- Balancing ---------- */
function parseF(f){
  let i = 0;
  function group(){
    const m = {};
    while (i < f.length && f[i] !== ')'){
      let sub;
      if (f[i] === '('){ i++; sub = group(); i++; }
      else { let el = f[i++]; while (i < f.length && /[a-z]/.test(f[i])) el += f[i++]; sub = {[el]:1}; }
      let n = ''; while (i < f.length && /\d/.test(f[i])) n += f[i++];
      const k = n ? +n : 1; for (const e in sub) m[e] = (m[e] || 0) + sub[e] * k;
    }
    return m;
  }
  return group();
}
function tally(L, R, c){
  const els = [], l = {}, r = {};
  const add = (f, k, side) => { const m = parseF(f); for (const e in m){ if (!els.includes(e)) els.push(e); side[e] = (side[e] || 0) + m[e] * k; } };
  L.forEach((f, i) => add(f, c[i], l)); R.forEach((f, k) => add(f, c[L.length + k], r));
  return { els, l, r };
}
const gcd = (a, b) => b ? gcd(b, a % b) : a;
function balState(L, R, c){
  const t = tally(L, R, c); const bal = t.els.every(e => (t.l[e] || 0) === (t.r[e] || 0));
  return { t, bal, lowest: c.reduce(gcd) === 1 };
}
function balancedText(L, R, c){
  const s = (f, k) => (k === 1 ? '' : k) + f;
  return L.map((f, i) => s(f, c[i])).join(' + ') + ' → ' + R.map((f, k) => s(f, c[L.length + k])).join(' + ');
}
function balanceHTML(L, R, c, locked){
  const sp = (f, i) => `<div class="sp"><div class="step">${locked ? '' : `<button class="sbtn" data-act="coef" data-i="${i}" data-d="1" aria-label="Increase coefficient">+</button>`}<span class="coef">${c[i]}</span>${locked ? '' : `<button class="sbtn" data-act="coef" data-i="${i}" data-d="-1" aria-label="Decrease coefficient">−</button>`}</div><div class="form">${F(f)}</div></div>`;
  const left = L.map((f, i) => sp(f, i)).join('<span class="op">+</span>');
  const right = R.map((f, k) => sp(f, L.length + k)).join('<span class="op">+</span>');
  const s = balState(L, R, c);
  const rows = s.t.els.map(e => { const a = s.t.l[e] || 0, b = s.t.r[e] || 0, k = a === b ? 'eq' : 'ne';
    return `<div class="ael">${e}</div><div class="acell ${k}">${a}</div><div class="acell ${k}">${b}</div>`; }).join('');
  const ml = c.slice(0, L.length).reduce((x, y) => x + y, 0), mr = c.slice(L.length).reduce((x, y) => x + y, 0);
  return `<div class="bal"><div class="eqrow">${left}<span class="op">→</span>${right}</div>
    <div class="atoms"><div class="ah">Atom</div><div class="ah">Left</div><div class="ah">Right</div>${rows}</div>
    <p class="moles">Total moles (sum of coefficients): <b>${ml}</b> left, <b>${mr}</b> right. <span class="dim">These don't have to match.</span></p></div>`;
}

const FRESH = ['New reading coming in.', 'Another reading from the station log.', 'Fresh values from the sensors.'];

const baseId = id => String(id).split('~')[0];
function variantOf(t, reroute){
  let v;
  if (t.type === 'calc'){ v = { id:t.id, type:'calc', topic:t.topic, gen:t.gen, p: CALC[t.gen].rand(t.p) }; }
  else {
    const pool = ORIG.concat(EXTRA).filter(x => x.type === t.type && x.topic === t.topic && baseId(x.id) !== baseId(t.id));
    v = JSON.parse(JSON.stringify(pick(pool.length ? pool : [t])));
    delete v.n;
  }
  v.id = baseId(v.id) + '~' + Math.random().toString(36).slice(2, 7);
  v.reroute = !!reroute; v.depth = (t.depth || 0) + (reroute ? 1 : 0);
  v.story = pick(reroute ? REROUTE : FRESH);
  return v;
}

const SND = {
  ctx:null,
  init(){ if (this.ctx) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} },
  tone(f, d, type = 'square', v = .05, f2 = null, delay = 0){
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .02);
  },
  noise(d, v = .05, delay = 0){
    const c = this.ctx, n = Math.floor(c.sampleRate * d), b = c.createBuffer(1, n, c.sampleRate), a = b.getChannelData(0);
    for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(), g = c.createGain(); s.buffer = b; g.gain.value = v; s.connect(g); g.connect(c.destination); s.start(c.currentTime + delay);
  },
  play(n){
    if (!st.sound) return; this.init(); if (!this.ctx) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const T = (...a) => this.tone(...a);
    switch (n){
      case 'tap': T(520, .04, 'square', .03); break;
      case 'key': T(880, .03, 'square', .025); break;
      case 'type': T(1400, .012, 'square', .006); break;
      case 'ok': [523, 659, 784, 1047].forEach((f, i) => T(f, .09, 'square', .045, null, i * .07)); break;
      case 'combo': [784, 988, 1175, 1568, 2093].forEach((f, i) => T(f, .08, 'square', .045, null, i * .05)); break;
      case 'minor': T(330, .12, 'square', .05); T(262, .18, 'square', .05, null, .13); break;
      case 'fail': T(220, .4, 'sawtooth', .06, 55); this.noise(.3, .05); break;
      case 'jam': this.noise(.18, .07); T(110, .18, 'square', .05); break;
      case 'pop': T(300, .07, 'square', .04, 1100); break;
      case 'zip': T(200, .15, 'square', .03, 900); break;
      case 'power': T(110, .6, 'square', .045, 880); [523, 784, 1047, 1568].forEach((f, i) => T(f, .12, 'square', .04, null, .55 + i * .09)); break;
      case 'badge': [659, 784, 1047, 1319, 1568].forEach((f, i) => T(f, .1, 'triangle', .07, null, i * .08)); break;
      case 'alarm': T(880, .15, 'square', .035); T(660, .15, 'square', .035, null, .17); break;
      case 'zap': this.noise(.25, .04); T(1500, .3, 'sawtooth', .025, 300); break;

function K(ctx){
  return {
    r(x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); },
    p(x, y, c){ ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); },
    line(x0, y0, x1, y1, c){
      x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
      const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1; let e = dx + dy; ctx.fillStyle = c;
      for (let n = 0; n < 400; n++){ ctx.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy){ e += dy; x0 += sx; } if (e2 <= dx){ e += dx; y0 += sy; } }
    },
    circ(cx, cy, r, c){ ctx.fillStyle = c; for (let y = -r; y <= r; y++){ const w = Math.floor(Math.sqrt(r * r - y * y) + .5); ctx.fillRect(cx - w, cy + y, 2 * w + 1, 1); } },
    ring(cx, cy, r, c){ ctx.fillStyle = c; for (let a = 0; a < 6.283; a += .5 / r) ctx.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), 1, 1); }
  };
}

const molly = { expr:'neutral', talkUntil:0 };
function drawMolly(ctx, t){
  const k = K(ctx); ctx.clearRect(0, 0, 18, 16);
  const e = molly.expr, alarm = e === 'alarm';
  k.r(8, 0, 2, 2, Math.floor(t * 2) % 2 ? C.sr : C.srD); k.r(8, 2, 2, 1, C.steel);
  k.r(1, 3, 16, 12, C.steel); k.r(2, 4, 14, 10, C.steelD); k.r(3, 5, 12, 8, alarm ? '#3a0e14' : '#0b1a2a');
  k.r(0, 7, 1, 4, C.steelD); k.r(17, 7, 1, 4, C.steelD); k.r(3, 15, 12, 1, C.steelD);
  const c = alarm ? C.sr : e === 'happy' ? C.ba : C.cu;
  const blink = (t % 3.3) < .13;
  const eye = (x) => {
    if (blink){ k.r(x, 8, 2, 1, c); return; }
    if (e === 'happy'){ k.p(x, 8, c); k.p(x + 1, 7, c); k.p(x + 2, 8, c); return; }
    if (e === 'worried'){ k.r(x, 7, 2, 2, c); k.p(x === 5 ? x + 1 : x - 1 + 1, 6, c); return; }
    if (e === 'alarm'){ k.r(x, 6, 2, 3, c); return; }
    k.r(x, 7, 2, 2, c);
  };
  if (e === 'smug' && !blink){ k.r(5, 8, 2, 1, c); k.r(11, 7, 2, 2, c); } else { eye(5); eye(11); }
  const talking = t < molly.talkUntil && Math.floor(t * 10) % 2;
  if (talking){ k.r(7, 10, 4, 2, c); }
  else if (e === 'happy'){ k.p(6, 10, c); k.r(7, 11, 4, 1, c); k.p(11, 10, c); }
  else if (e === 'worried'){ k.p(6, 11, c); k.p(7, 10, c); k.p(8, 11, c); k.p(9, 10, c); k.p(10, 11, c); k.p(11, 10, c); }
  else if (e === 'smug'){ k.r(8, 11, 3, 1, c); k.p(11, 10, c); }
  else if (alarm){ k.r(8, 10, 2, 2, c); }
  else k.r(7, 11, 4, 1, c);
}

  el.innerHTML = `<span class="who">${CAMP.pal}</span>${F(text)}`;
  if (reduced()) return;
  const nodes = []; const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n; w.nextNode();
  while ((n = w.nextNode())){ nodes.push([n, n.nodeValue]); n.nodeValue = ''; }
  let i = 0, j = 0; molly.talkUntil = 1e12;
  const finish = () => { clearInterval(sayTimer); nodes.forEach(([nd, tx]) => { nd.nodeValue = tx; }); molly.talkUntil = 0; };
  sayTimer = setInterval(() => {
    for (let s = 0; s < 2; s++){
      if (i >= nodes.length){ finish(); return; }
      const [nd, tx] = nodes[i]; nd.nodeValue = tx.slice(0, ++j); if (j >= tx.length){ i++; j = 0; }

  }, 26);
  el.onclick = finish;

function submit(){

      if (ui.flags.bal) pre.push(['Balancing', false, 'The equation wasn\'t balanced on your first try.']);
      ok = g.ok && !ui.flags.sel && !ui.flags.bal; sev = g.sev;

    }

      html = listChecks([['Value', vOk, vOk ? 'Correct.' : `The key says ${t.v.toFixed(2)}.`], ['Unit', uOk, uOk ? t.unit : `It should be ${t.unit}. ${t.unit === 'g' ? 'One mole is measured in grams.' : 'One particle is measured in amu.'}`]]) + `<p>${F(t.why)}</p>`;
      break;
    }

      const msg = ok ? '' : !s.bal ? 'The equation wasn\'t balanced. Check the ≠ rows.' : !s.lowest ? 'Balanced, but not in lowest whole numbers. Divide every coefficient by the same number.' : 'Balanced, but not the expected coefficients.';
      html = (msg ? `<p>${msg}</p>` : '') + solutionHTML(t);
      if (!ok) ui.coefs = t.sol.slice();

    }
    case 'nums': ok = ui.nv[0] === t.a[0] && ui.nv[1] === t.a[1]; html = solutionHTML(t); break;

    }
    case 'text': {

      if (vals.some(v => !v)) return setErr('Fill in every line of the label.');
      const rows = t.fields.map((f, i) => { const good = f.accept.map(a => normT(a, f.cs)).includes(vals[i]); return [f.label, good, good ? 'Correct.' : `Answer: ${f.disp || f.accept[0]}`]; });
      ok = rows.every(r => r[1]); html = listChecks(rows) + `<p>${F(t.why)}</p>`; break;
    }
    case 'net': {
      const N = ui.net, wrong = [];
      [['L', N.L], ['R', N.R]].forEach(([sd, arr]) => arr.forEach((x, i) => { if (x.ions) x.ions.forEach((io, j) => { const k = sd + i + '-' + j; if (!!N.struck[k] !== t.spect.includes(io[0])) wrong.push(io[0]); }); }));

      break;

    case 'redox': {

function pickChoice(v){

const OKL = ['Repair holds. Nice.', 'Clean. Exactly what the key says.', 'That\'s how it\'s done.', 'Confirmed. Moving on.', 'Good. I\'d have gotten that too, before the meteor.'];

function keyIn(k){
  const kp = ui.kp; if (!kp || ui.done) return;
  const sci = ui.t.type === 'calc';
  if (k === 'exp'){ if (sci) kp.f = kp.f === 'm' ? 'e' : 'm'; }
  else if (k === 'neg'){ if (sci){ kp.neg = !kp.neg; kp.f = 'e'; } }
  else if (k === 'bk'){ if (kp.f === 'e' && !kp.e && sci){ kp.f = 'm'; } else kp[kp.f] = kp[kp.f].slice(0, -1); }
  else if (k === 'clr'){ kp.m = ''; kp.e = ''; kp.neg = false; kp.f = 'm'; }
  else if (k === '.'){ if (kp.f === 'm' && !kp.m.includes('.')) kp.m = (kp.m || '0') + '.'; }
  else if (/^\d$/.test(k)){ if (kp.f === 'm'){ if (kp.m.length < 9) kp.m += k; } else if (kp.e.length < 2) kp.e += k; }
  SND.play('key');
  const lcd = document.getElementById('lcd'); if (lcd) lcd.outerHTML = lcdHTML(sci);
  view.querySelectorAll('[data-k="exp"]').forEach(b => b.classList.toggle('on', kp.f === 'e'));
  view.querySelectorAll('[data-k="neg"]').forEach(b => b.classList.toggle('on', kp.neg));
}
document.addEventListener('keydown', e => {
  if (!ui.kp || ui.done || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey) return;
  if (!document.getElementById('lcd')) return;
  const map = {Backspace:'bk', Delete:'clr', e:'exp', E:'exp', '^':'exp', '-':'neg', '.':'.', ',':'.'};
  if (/^\d$/.test(e.key)){ keyIn(e.key); e.preventDefault(); }
  else if (map[e.key]){ keyIn(map[e.key]); e.preventDefault(); }

function lewisSVG(L){

  const dot = (x, y) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" fill="currentColor"/>`;
  const fq = q => String(q).replace('-', '−');
  let s = '';
  (L.bonds || []).forEach(([i, j, o]) => {
    const a = L.atoms[i], b = L.atoms[j]; let x1 = px(a), y1 = py(a), x2 = px(b), y2 = py(b);
    const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy), ux = dx / d, uy = dy / d;
    x1 += ux * 14; y1 += uy * 14; x2 -= ux * 14; y2 -= uy * 14;
    for (let k = 0; k < o; k++){ const off = (k - (o - 1) / 2) * 5; s += `<line x1="${(x1 - uy * off).toFixed(1)}" y1="${(y1 + ux * off).toFixed(1)}" x2="${(x2 - uy * off).toFixed(1)}" y2="${(y2 + ux * off).toFixed(1)}" stroke="currentColor" stroke-width="2"/>`; }
  });
  L.atoms.forEach(a => {
    const x = px(a), y = py(a);
    s += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="700" fill="currentColor">${a.s}</text>`;
    const sides = [[0, -17, 1, 0], [17, 0, 0, 1], [0, 17, 1, 0], [-17, 0, 0, 1]];
    (a.d || [0, 0, 0, 0]).forEach((n, i) => { const [ox, oy, sx, sy] = sides[i]; if (n === 1) s += dot(x + ox, y + oy); if (n === 2) s += dot(x + ox - sx * 4.5, y + oy - sy * 4.5) + dot(x + ox + sx * 4.5, y + oy + sy * 4.5); });
    if (a.q) s += `<text x="${x + 13}" y="${y - 12}" font-size="13" font-weight="700" fill="currentColor">${fq(a.q)}</text>`;
  });
  if (L.br){
    const xr = W - qw - 8;
    s += `<path d="M16 7 H9 V${H - 7} H16 M${xr - 7} 7 H${xr} V${H - 7} H${xr - 7}" fill="none" stroke="currentColor" stroke-width="2"/>`;
    if (L.q) s += `<text x="${xr + 4}" y="17" font-size="15" font-weight="700" fill="currentColor">${fq(L.q)}</text>`;

  if (beam) for (let i = 0; i < 4; i++) k.p(24 + (i % 2 ? 3 : -3) * Math.sin(t * 3 + i), 0, C.cu);
}
